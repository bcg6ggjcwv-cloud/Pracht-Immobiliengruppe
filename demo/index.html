/* Layout: ruhige Einspalten-App (max. 960px), Kopfzeile mit Wortmarke, Reiterleiste, feine Linien statt Schatten.
   Bewusst nur ein (helles) Erscheinungsbild – entspricht dem Markenauftritt der Pracht Immobiliengruppe. */
:root {
  --gruen: #1E3A2F;
  --beige: #EDE4D1;
  --sand: #C9B488;
  --creme: #F4EEE2;
  --leise: #4B5D54;
  --linie: #C9B488;
  --fehler: #8A2B1F;
  --ok: #2F5D3A;
  --warn: #8A5A12;
  --weiss: #FBF8F1;
  --serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
  --garamond: "EB Garamond", Garamond, Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--beige); color: var(--gruen); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; hyphens: auto; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.3rem); line-height: 1.2; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gruen); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) { .einblenden { animation: ein .25s ease-out; } }
@keyframes ein { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.rahmen { max-width: 960px; margin: 0 auto; padding-inline: 20px; }
.demoband { background: var(--gruen); color: var(--beige); font-size: 13px; }
.demoband .rahmen { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 8px; }
.demoband button { background: none; border: 1px solid var(--sand); color: var(--beige); padding: 3px 10px; font-size: 12px; letter-spacing: .08em; cursor: pointer; }
.demoband button:hover { background: var(--sand); color: var(--gruen); }
.demoband .gruppe { display: flex; gap: 8px; flex-wrap: wrap; }

header.kopf { border-bottom: 1px solid var(--linie); }
header.kopf .rahmen { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.logo { height: 54px; width: auto; display: block; }
.wer { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.wer .name { color: var(--leise); text-align: right; line-height: 1.3; }
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--gruen); background: none; padding: 10px 18px; font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
.knopf:hover { background: var(--gruen); color: var(--beige); }
.knopf.voll { background: var(--gruen); color: var(--beige); }
.knopf.voll:hover { background: #2a4d3f; }
.knopf.klein { padding: 6px 12px; font-size: 11.5px; }
.knopf[disabled] { opacity: .45; cursor: not-allowed; }

nav.reiter { border-bottom: 1px solid var(--linie); overflow-x: auto; }
nav.reiter .rahmen { display: flex; gap: 4px; }
nav.reiter button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px 10px; font-size: 14px; letter-spacing: .04em; white-space: nowrap; cursor: pointer; color: var(--leise); }
nav.reiter button[aria-current="page"] { color: var(--gruen); border-bottom-color: var(--gruen); }
nav.reiter button:hover { color: var(--gruen); }
.zahl { display: inline-block; min-width: 1.4em; padding: 0 .35em; margin-left: 4px; font-size: 11.5px; line-height: 1.5; background: var(--sand); color: var(--gruen); text-align: center; }

main { padding-block: 32px 64px; }
.stapel { display: flex; flex-direction: column; gap: 28px; }
.stapel.eng { gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--leise); }
.leise { color: var(--leise); }
.klein { font-size: 13.5px; }
.linie { height: 1px; background: var(--linie); border: 0; margin: 0; }
.flaeche { background: var(--creme); border: 1px solid var(--linie); padding: 22px; }
.raster { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.raster > * { min-width: 0; }
.kpi { border: 1px solid var(--linie); background: var(--creme); padding: 18px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; }
.kpi:hover { border-color: var(--gruen); }
.kpi .wert { font-family: var(--serif); font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi.achtung { border-left: 3px solid var(--warn); }

.liste { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linie); }
.liste > li { border-bottom: 1px solid var(--linie); padding: 14px 0; display: flex; gap: 12px 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.liste > li > .haupt { min-width: 0; flex: 1 1 260px; }
.liste .titel { font-family: var(--serif); font-size: 1.05rem; }
button.zeile { all: unset; cursor: pointer; display: block; width: 100%; }
button.zeile:hover .titel { text-decoration: underline; text-decoration-color: var(--sand); text-underline-offset: 4px; }
button.zeile:focus-visible { outline: 2px solid var(--gruen); outline-offset: 3px; }

.pille { display: inline-block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; white-space: nowrap; }
.pille.neu { color: var(--warn); }
.pille.bearbeitung { color: var(--gruen); }
.pille.erledigt { color: var(--ok); background: #e3e7d9; border-color: #e3e7d9; }
.pille.angefochten { color: var(--fehler); }
.pille.frist { color: var(--warn); }
.pille.bestand { color: var(--leise); }
.pille.ungelesen { color: var(--gruen); background: var(--sand); border-color: var(--sand); }
.pille.persoenlich { color: var(--leise); }

.filter { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.filter > * { flex: 1 1 160px; min-width: 0; }
label.feld { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.feld input, .feld select, .feld textarea { width: 100%; border: 1px solid var(--linie); background: var(--weiss); padding: 10px 12px; font-size: 16px; border-radius: 0; }
.feld input:focus, .feld select:focus, .feld textarea:focus { outline: none; border-color: var(--gruen); }
.feld input[readonly] { background: transparent; color: var(--leise); }
.feld .hinweis { font-size: 12.5px; color: var(--leise); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--linie); background: none; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--gruen); color: var(--beige); border-color: var(--gruen); }

.notfall { border: 1px solid var(--gruen); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.notfall .reihe { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; border-top: 1px solid var(--linie); padding-top: 10px; }
.tel { font-variant-numeric: tabular-nums; font-weight: 500; user-select: all; }

.makler { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.makler button { border: 1px solid var(--linie); background: var(--creme); padding: 18px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.makler button:hover { border-color: var(--gruen); }
.makler .titel { font-family: var(--serif); font-size: 1.1rem; }

.meldung { border-left: 2px solid var(--gruen); background: var(--creme); padding: 12px 16px; font-size: 14.5px; }
.meldung.warn { border-left-color: var(--warn); }

/* Dialog */
.schleier { position: fixed; inset: 0; background: rgba(30, 58, 47, .35); display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; z-index: 10; }
.dialog { background: var(--beige); border: 1px solid var(--gruen); width: 100%; max-width: 680px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.dialog .kopfzeile { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.schliessen { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; padding: 0 4px; }

/* Dokumentansicht im PDF-Stil */
.blatt { background: var(--weiss); border: 1px solid var(--linie); padding: clamp(18px, 4vw, 36px); display: flex; flex-direction: column; gap: 14px; font-size: 14px; }
.blatt .briefkopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--gruen); padding-bottom: 10px; }
.tabelle { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
th { font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--leise); }
td.r, th.r { text-align: right; }
tr.summe td { border-top: 1px solid var(--gruen); font-weight: 500; }

/* Anmeldung */
.anmeldung { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.anmeldung .mitte { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.konten { display: flex; flex-direction: column; gap: 10px; }
.konto { border: 1px solid var(--linie); background: var(--creme); padding: 14px 16px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.konto:hover { border-color: var(--gruen); }
.qr { width: 150px; height: 150px; background: var(--weiss); border: 1px solid var(--linie); }

.fotos { display: flex; gap: 8px; flex-wrap: wrap; }
.fotos img { width: 84px; height: 84px; object-fit: cover; border: 1px solid var(--linie); }
.verlauf { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.verlauf li { border-left: 1px solid var(--sand); padding-left: 12px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--gruen); color: var(--beige); padding: 12px 18px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

footer.fuss { border-top: 1px solid var(--linie); font-size: 13px; color: var(--leise); }
footer.fuss .rahmen { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; padding-block: 18px; }
@media (max-width: 560px) {
  .logo { height: 44px; }
  .wer .name { display: none; }
  .dialog { padding: 18px; }
}

let D = laden();
function laden() {
  try { const s = localStorage.getItem(SPEICHER); if (s) return JSON.parse(s); } catch (e) {}
  return startdaten();
}
function speichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(D)); } catch (e) {} }

// Sitzung (nicht gespeichert – nach Neuladen wieder Anmeldung)

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const datum = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
const euro = (n) => n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const mea = (n) => n.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const heuteIso = () => HEUTE.toISOString().slice(0, 10);
const tageBis = (iso) => Math.round((new Date(iso + "T12:00:00") - HEUTE) / 864e5);
const weg = (id) => D.wegs.find((w) => w.id === id);
const einheit = (id) => D.einheiten.find((e) => e.id === id);
const person = (id) => D.personen.find((p) => p.id === id);
const pName = (p) => [p.titel, p.vorname, p.nachname].filter(Boolean).join(" ");
const statusKlasse = (s) => ({ "Neu": "neu", "In Bearbeitung": "bearbeitung", "Erledigt": "erledigt" }[s]);
const neueId = (p) => p + Math.random().toString(36).slice(2, 8);

function toast(text) {
  const ort = $("#toast-ort");
  ort.innerHTML = `<div class="toast einblenden">${esc(text)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (ort.innerHTML = ""), 3200);
}

function anfechtung(b) {
  if (b.angefochten) return `<span class="pille angefochten">Angefochten</span>`;
  const ende = new Date(b.datum + "T12:00:00"); ende.setMonth(ende.getMonth() + 1);
  return ende > HEUTE
    ? `<span class="pille frist">Anfechtungsfrist bis ${ende.toLocaleDateString("de-DE")}</span>`
    : `<span class="pille bestand">Bestandskräftig</span>`;
}

// Sichtbarkeit wie in den Zugriffsregeln der Datenbank
function erikaSieht(d) {
  if (d.weg !== "w1") return false;
  if (d.person && d.person !== ERIKA) return false;
  if (d.einheit && d.einheit !== "e3") return false;

}

function rahmen() {
  const angemeldet = S.rolle && S.schritt === "fertig";
  $("#kopf").innerHTML = `${LOGO}<div class="wer">${angemeldet

    <button data-aktion="zuruecksetzen">Demo zurücksetzen</button>`;
  const nav = $("#reiter");
  nav.hidden = !angemeldet;
  if (angemeldet) {
    const zaehler = S.rolle === "eigentuemer"
      ? { dokumente: D.dokumente.filter((d) => erikaSieht(d) && d.pflicht && !istGelesen(d.id, ERIKA)).length }

  }
}

function zeigen() {
  rahmen();

  if (!S.rolle || S.schritt !== "fertig") ziel.innerHTML = anmeldung();

}

function anliegenListe(liste, verwaltung) {
  if (!liste.length) return `<p class="leise">Noch keine Anliegen.</p>`;
  return `<ul class="liste">${liste.map((a) => {

const V = {
  dashboard() {
    const offen = D.anliegen.filter((a) => a.status !== "Erledigt");
    const makler = D.anliegen.filter((a) => a.art.startsWith("Makleranfrage") && a.status === "Neu");
    const pflicht = D.dokumente.filter((d) => d.pflicht);
    let ungelesen = 0;
    pflicht.forEach((d) => empfaenger(d).forEach((p) => { if (!istGelesen(d.id, p.id)) ungelesen++; }));

    return `<div class="stapel">
      <section class="stapel eng"><p class="eyebrow">Verwaltung</p><h1>Guten Tag, Vera Verwalterin</h1><p class="leise">Stand ${HEUTE.toLocaleDateString("de-DE")} · ${D.wegs.length} Gemeinschaften · ${D.einheiten.length} Einheiten</p></section>
      <section class="raster">
        <button class="kpi ${offen.length ? "achtung" : ""}" data-reiter="anliegen"><span class="eyebrow">Offene Anliegen</span><span class="wert">${offen.length}</span><span class="klein leise">davon ${offen.filter((a) => a.status === "Neu").length} neu</span></button>
        <button class="kpi ${makler.length ? "achtung" : ""}" data-reiter="anliegen"><span class="eyebrow">Neue Makleranfragen</span><span class="wert">${makler.length}</span><span class="klein leise">${makler.map((a) => esc(a.betreff)).join(", ") || "keine"}</span></button>
        <button class="kpi" data-reiter="dokumente"><span class="eyebrow">Ungelesene Pflichtdokumente</span><span class="wert">${ungelesen}</span><span class="klein leise">Lesebestätigungen fehlen</span></button>
        <button class="kpi ${auslaufend.length ? "achtung" : ""}" data-reiter="eigentuemer"><span class="eyebrow">Verwalterbestellung</span><span class="wert">${auslaufend.length}</span><span class="klein leise">${auslaufend.map((w) => `${esc(w.name)} endet ${datum(w.bestelltBis)} (in ${tageBis(w.bestelltBis)} Tagen)`).join("; ") || "keine läuft in 6 Monaten aus"}</span></button>
      </section>
      ${auslaufend.length ? `<div class="meldung warn">Die Bestellung für <strong>${esc(auslaufend[0].name)}</strong> endet am ${datum(auslaufend[0].bestelltBis)}. Die Wiederbestellung sollte auf die Tagesordnung der nächsten Versammlung.</div>` : ""}
      <section class="stapel eng"><h2>Gemeinschaften</h2>
        <ul class="liste">${D.wegs.map((w) => `<li><div class="haupt"><span class="titel">${esc(w.name)}</span><br><span class="klein leise">${esc(w.strasse)}, ${esc(w.plz)} ${esc(w.ort)} · Baujahr ${w.baujahr} · ${((n) => n === 1 ? "1 Einheit" : n + " Einheiten")(D.einheiten.filter((e) => e.weg === w.id).length)} · Stimmrecht nach ${esc(w.prinzip)}</span></div>
          <span class="klein leise">bestellt bis ${datum(w.bestelltBis)}</span></li>`).join("")}</ul>
      </section>
    </div>`;
  },

  anliegen() {
    const liste = [...D.anliegen].sort((a, b) => (a.status === "Erledigt") - (b.status === "Erledigt") || b.datum.localeCompare(a.datum));
    return `<div class="stapel">
      <section class="stapel eng"><h1>Anliegen</h1><p class="leise">Alle Meldungen aus den Gemeinschaften. Status ändern Sie im Anliegen; die Eigentümer sehen ihn sofort.</p></section>

  eigentuemer() {

      <div class="tabelle"><table>
        <thead><tr><th>Einheit</th><th>Lage</th><th class="r">MEA</th><th>Eigentümer</th><th>Portal</th><th></th></tr></thead>
        <tbody>${D.einheiten.filter((e) => e.weg === "w1").map((e) => D.personen.filter((p) => p.einheit === e.id).map((p, i) => `<tr>
          <td>${i === 0 ? esc(e.nr) : ""}</td><td>${i === 0 ? esc(e.lage) : ""}</td><td class="r">${i === 0 ? mea(e.mea) : ""}</td>
          <td>${esc(pName(p))}${p.hinweis ? `<br><span class="klein leise">${esc(p.hinweis)}</span>` : ""}</td>

  dokumente() {

      <section class="stapel eng" style="flex-direction:row;justify-content:space-between;align-items:end;flex-wrap:wrap">

          <span class="klein leise">${esc(d.kat)} · ${d.jahr} · sichtbar für ${d.person ? "nur " + esc(pName(person(d.person))) : d.einheit ? "Eigentümer " + esc(einheit(d.einheit).nr) : "alle Eigentümer"}</span></button>
          ${d.pflicht ? `<span class="klein" style="font-variant-numeric:tabular-nums">${gel} von ${emp.length} gelesen</span>` : ""}</li>`;
      }).join("")}</ul>

  },

  mitteilung() {
    const liste = [...D.mitteilungen].sort((a, b) => b.datum.localeCompare(a.datum));
    return `<div class="stapel">

      <form class="flaeche stapel eng" data-form="mitteilung">
        <div class="filter">
          <label class="feld">Gemeinschaft<select id="m-weg">${D.wegs.map((w) => `<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select></label>
          <label class="feld">Art<select id="m-art"><option>Aushang</option><option>Rundschreiben</option></select></label>
        </div>
        <label class="feld">Titel<input id="m-titel" required placeholder="z. B. Treppenhausreinigung"></label>
        <label class="feld">Text<textarea id="m-text" rows="4" required></textarea></label>
        <div><button class="knopf voll" type="submit">Veröffentlichen und benachrichtigen</button></div>
      </form>
      <ul class="liste">${liste.map((m) => `<li><div class="haupt"><span class="klein leise">${datum(m.datum)} · ${esc(m.art)} · ${esc(weg(m.weg).name)}</span><br><span class="titel">${esc(m.titel)}</span></div></li>`).join("")}</ul>
    </div>`;
  },

  freigaben() {
    return `<div class="stapel">
      <section class="stapel eng"><h1>Mitarbeiter</h1><p class="leise">Mitarbeiter sehen nur die Gemeinschaften, die Sie freigeben. Löschen, Rollen ändern und das Zugriffsprotokoll bleiben Ihnen vorbehalten.</p></section>
      <div class="tabelle"><table><thead><tr><th>Mitarbeiter</th><th>Freigabe</th></tr></thead><tbody>
        ${D.mitarbeiter.map((m) => `<tr><td>${esc(m.name)}</td><td><label class="feld"><select data-aktion="freigabe" data-id="${m.id}" aria-label="Freigabe für ${esc(m.name)}">
          <option value="" ${!m.freigabe ? "selected" : ""}>Keine Freigabe (sieht nichts)</option>
          ${D.wegs.map((w) => `<option value="${w.id}" ${m.freigabe === w.id ? "selected" : ""}>Nur ${esc(w.name)}</option>`).join("")}
          <option value="alle" ${m.freigabe === "alle" ? "selected" : ""}>Alle Gemeinschaften</option></select></label></td></tr>`).join("")}
      </tbody></table></div>
      <section class="stapel eng"><h2>Zugriffsprotokoll</h2><p class="klein leise">Jede Änderung und jedes geöffnete Dokument wird protokolliert. Nur Sie als Verwalterin können das Protokoll lesen, niemand kann es ändern.</p>
        <ul class="verlauf">${(D.protokoll ?? []).slice(-6).reverse().map((z) => `<li>${esc(z)}</li>`).join("") || `<li class="leise">Noch keine Einträge in dieser Demo-Sitzung.</li>`}</ul>
      </section>
    </div>`;
  },
};

// Wer muss ein Dokument lesen? (aktuelle Eigentümer mit Portalzugang)
function empfaenger(d) {
  return D.personen.filter((p) => {
    const e = einheit(p.einheit);
    if (!e || e.weg !== d.weg) return false;
    if (d.person) return p.id === d.person;
    if (d.einheit) return p.einheit === d.einheit;
    return p.zugang === "aktiv";
  });
}
function protokoll(text) {
  D.protokoll = D.protokoll ?? [];
  D.protokoll.push(`${HEUTE.toLocaleDateString("de-DE")} · ${S.rolle === "verwalter" ? "Vera Verwalterin" : "Erika Muster"}: ${text}`);
}

function dialog(titel, inhalt) {
  $("#dialog-ort").innerHTML = `<div class="schleier" data-aktion="schliessen-hinter"><div class="dialog einblenden" role="dialog" aria-modal="true" aria-label="${esc(titel)}">
    <div class="kopfzeile"><h2>${esc(titel)}</h2><button class="schliessen" data-aktion="schliessen" aria-label="Schließen">×</button></div>${inhalt}</div></div>`;
  $("#dialog-ort .dialog").querySelector("input, select, textarea, button.knopf, .schliessen")?.focus();
}
const schliessen = () => ($("#dialog-ort").innerHTML = "");

function dokumentAnsicht(d) {
  const e = einheit("e3"), anteil = e.mea / 1000;
  const kopf = `<div class="briefkopf"><span style="font-family:var(--serif);letter-spacing:.26em">PRACHT</span><span class="klein leise">${esc(weg(d.weg).name)}</span></div>`;
  if (d.art === "abrechnung") {
    const posten = [["Heizung und Warmwasser", 38420, "nach Verbrauch (HeizkostenV)", 3712.4], ["Hausmeister", 9600, "MEA"], ["Gebäudeversicherung", 6840, "MEA"], ["Aufzug Wartung und Strom", 4210, "MEA"], ["Treppenhausreinigung", 5280, "MEA"], ["Allgemeinstrom", 1460, "MEA"], ["Verwaltervergütung", 8064, "je Einheit", 1008], ["Zuführung Erhaltungsrücklage", 18000, "MEA"]];
    let summe = 0;
    const zeilen = posten.map(([k, g, s, fest]) => { const a = fest ?? g * anteil; summe += a; return `<tr><td>${k}</td><td class="r">${euro(g)}</td><td>${s}</td><td class="r">${euro(a)}</td></tr>`; }).join("");
    const voraus = 12 * 1260;
    return `<div class="blatt">${kopf}<h3>Einzelabrechnung 2025 · ${e.nr} · Erika Muster</h3>
      <p class="klein leise">Abrechnungszeitraum 01.01.–31.12.2025 · Miteigentumsanteil ${mea(e.mea)}/1.000</p>
      <div class="tabelle"><table><thead><tr><th>Kostenart</th><th class="r">Gesamt</th><th>Schlüssel</th><th class="r">Ihr Anteil</th></tr></thead><tbody>${zeilen}
        <tr class="summe"><td colspan="3">Summe Ihrer Kosten</td><td class="r">${euro(summe)}</td></tr>
        <tr><td colspan="3">Hausgeld-Vorauszahlungen (12 × ${euro(1260)})</td><td class="r">− ${euro(voraus)}</td></tr>
        <tr class="summe"><td colspan="3">Abrechnungsspitze (${summe - voraus > 0 ? "Nachzahlung" : "Guthaben"})</td><td class="r">${euro(Math.abs(summe - voraus))}</td></tr></tbody></table></div>
      <p class="klein leise">Beschlossen in der Versammlung am 14.05.2026 (Beschluss Nr. 2026/01). Fällig zum 01.07.2026.</p></div>`;
  }
  if (d.art === "wirtschaftsplan") return `<div class="blatt">${kopf}<h3>Wirtschaftsplan 2026</h3>
    <div class="tabelle"><table><thead><tr><th>Position</th><th class="r">Ansatz 2026</th><th class="r">Ist 2025</th></tr></thead><tbody>
    <tr><td>Bewirtschaftungskosten</td><td class="r">${euro(76500)}</td><td class="r">${euro(73874)}</td></tr>
    <tr><td>Zuführung Erhaltungsrücklage</td><td class="r">${euro(18000)}</td><td class="r">${euro(18000)}</td></tr>
    <tr class="summe"><td>Gesamt</td><td class="r">${euro(94500)}</td><td class="r">${euro(91874)}</td></tr></tbody></table></div>
    <p class="klein">Ihr monatliches Hausgeld ab 01.01.2026: <strong>${euro(1295)}</strong> (${e.nr}, MEA ${mea(e.mea)})</p></div>`;
  if (d.art === "vermoegen") return `<div class="blatt">${kopf}<h3>Vermögensbericht zum 31.12.2025</h3>
    <div class="tabelle"><table><tbody>
    <tr><td>Erhaltungsrücklage</td><td class="r">${euro(142380.55)}</td></tr><tr><td>Girokonto der Gemeinschaft</td><td class="r">${euro(11204.18)}</td></tr>
    <tr><td>Forderungen gegen Eigentümer (Hausgeldrückstände)</td><td class="r">${euro(0)}</td></tr><tr><td>Verbindlichkeiten (offene Rechnungen)</td><td class="r">− ${euro(3118.4)}</td></tr>
    <tr class="summe"><td>Gemeinschaftsvermögen</td><td class="r">${euro(150466.33)}</td></tr></tbody></table></div>
    <p class="klein leise">Wesentliches Gemeinschaftsvermögen nach § 28 Abs. 4 WEG: Rücklage, Konten, Heizungsanlage (Baujahr 2019).</p></div>`;
  if (d.art === "protokoll") return `<div class="blatt">${kopf}<h3>Niederschrift über die ordentliche Eigentümerversammlung am 14.05.2026</h3>
    <p class="klein">Ort: Gemeindesaal Stuttgart-West, Beginn 18:30 Uhr. Vorsitz: Vera Verwalterin (Pracht Immobiliengruppe). Anwesend oder vertreten: 875,5/1.000 MEA – beschlussfähig.</p>
    <p class="klein">TOP 2 Jahresabrechnung 2025 · TOP 3 Wirtschaftsplan 2026 · TOP 5 Fassadenreinigung · TOP 6 Ladestationen Tiefgarage</p>
    <p class="klein leise">Die Beschlüsse im Wortlaut finden Sie in der Beschluss-Sammlung (Nr. 2026/01 bis 2026/04).</p></div>`;
  return `<div class="blatt">${kopf}<h3>${esc(d.titel)}</h3><p class="klein leise">Vorschau dieses Dokuments ist in der Demo nicht hinterlegt. Im Portal öffnet sich hier die PDF-Datei.</p></div>`;
}

// ---------------------------------------------------------------------------
// Aktionen
// ---------------------------------------------------------------------------
document.addEventListener("click", (ev) => {
  const r = ev.target.closest("[data-reiter]");
  if (r) { S.reiter = r.dataset.reiter; schliessen(); zeigen(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest("[data-aktion]");
  if (!el) return;
  const a = el.dataset.aktion, id = el.dataset.id;

  if (a === "schliessen-hinter" && ev.target !== el) return;
  if (a === "schliessen" || a === "schliessen-hinter") return schliessen();
  if (a === "konto") { S.rolle = el.dataset.rolle; S.schritt = "passwort"; return zeigen(); }
  if (a === "abmelden") { S.rolle = null; S.schritt = "konto"; return zeigen(); }
  if (a === "wechseln") { S.rolle = S.rolle === "eigentuemer" ? "verwalter" : "eigentuemer"; S.reiter = S.rolle === "eigentuemer" ? "uebersicht" : "dashboard"; return zeigen(); }
  if (a === "zuruecksetzen") {
    if (el.dataset.sicher !== "1") { el.dataset.sicher = "1"; el.textContent = "Wirklich zurücksetzen?"; setTimeout(() => { el.dataset.sicher = ""; el.textContent = "Demo zurücksetzen"; }, 3000); return; }
    D = startdaten(); speichern(); S.filter = { kat: "Alle", jahr: "Alle", suche: "" }; S.bSuche = ""; toast("Demo auf den Anfangsstand zurückgesetzt."); return zeigen();
  }
  if (a === "kat") { S.filter.kat = el.dataset.wert; return zeigen(); }

  if (a === "oeffnen") {
    const d = D.dokumente.find((x) => x.id === id);
    const neu = !istGelesen(id, ERIKA);
    if (neu) { (D.gelesen[id] = D.gelesen[id] ?? {})[ERIKA] = heuteIso(); protokoll(`Dokument geöffnet: ${d.titel}`); speichern(); }
    dialog(d.titel, `${dokumentAnsicht(d)}<p class="klein leise">${neu ? "Lesebestätigung gespeichert: " : "Gelesen am "}${datum(D.gelesen[id][ERIKA])}. Die Verwaltung sieht, dass Sie das Dokument geöffnet haben.</p>`);
    rahmen(); if (S.reiter === "dokumente") $("#inhalt").innerHTML = E.dokumente();
    return;
  }

  if (a === "makler") {
    const art = el.dataset.art, e = einheit("e3"), w = weg("w1");
    dialog(`${art === "Bewertung" ? "Wert ermitteln" : art === "Vermietung" ? "Wohnung vermieten" : "Wohnung verkaufen"}`, `
      <form class="stapel eng" data-form="makler" data-art="${art}">
        <p class="klein leise">Diese Angaben haben wir aus Ihren Objektdaten übernommen:</p>
        <div class="flaeche klein" style="padding:14px">${esc(w.strasse)}, ${esc(w.plz)} ${esc(w.ort)} · ${esc(e.nr)}, ${esc(e.lage)} · Baujahr ${w.baujahr} · MEA ${mea(e.mea)}/1.000</div>
        <label class="feld">Zeitrahmen<select id="mk-zeit"><option>So bald wie möglich</option><option>In den nächsten 6 Monaten</option><option>Nur informieren</option></select></label>
        <label class="feld">Nachricht (freiwillig)<textarea id="mk-text" rows="3" placeholder="z. B. Wohnung ist derzeit selbst genutzt"></textarea></label>
        <button class="knopf voll" type="submit">Anfrage senden</button>
      </form>`);
    return;
  }

  if (a === "melden") {
    dialog("Anliegen melden", `
      <form class="stapel eng" data-form="melden">
        <label class="feld">Art<select id="n-art"><option>Schaden</option><option>Frage</option></select></label>
        <label class="feld">Betreff<input id="n-betreff" required placeholder="z. B. Licht im Treppenhaus defekt"></label>
        <label class="feld">Wo im Gebäude?<select id="n-ort"><option>Treppenhaus</option><option>Keller</option><option>Tiefgarage</option><option>Hauseingang</option><option>Dach / Fassade</option><option>Außenanlage</option><option>In meiner Wohnung (Gemeinschaftseigentum)</option></select></label>
        <label class="feld">Beschreibung<textarea id="n-text" rows="4" required></textarea></label>
        <label class="feld">Fotos (freiwillig)<input id="n-fotos" type="file" accept="image/*" multiple><span class="hinweis">Fotos bleiben in der Demo nur in diesem Browserfenster.</span></label>
        <div class="fotos" id="n-vorschau"></div>
        <button class="knopf voll" type="submit">Absenden</button>
      </form>`);
    return;
  }

  if (a === "anliegen") {
    const x = D.anliegen.find((y) => y.id === id), p = person(x.person), e = einheit(x.einheit);
    const verw = S.rolle === "verwalter";
    dialog(x.betreff, `
      <div class="stapel eng">
        <p class="klein leise">${datum(x.datum)} · ${esc(x.art)}${x.ort ? " · " + esc(x.ort) : ""}${verw ? ` · ${esc(pName(p))}, ${esc(e?.nr ?? "")}, ${esc(weg(x.weg).name)}` : ""}</p>
        <p>${esc(x.text)}</p>
        ${x.fotos?.length ? `<div class="fotos">${x.fotos.map((f) => `<img src="${f}" alt="Foto zum Anliegen">`).join("")}</div>` : ""}
        <h3>Verlauf</h3>
        <ul class="verlauf">${x.verlauf.map(([d, t]) => `<li><span class="klein leise">${datum(d)}</span><br>${esc(t)}</li>`).join("")}</ul>
        ${verw ? `<form class="flaeche stapel eng" data-form="status" data-id="${x.id}">
          <label class="feld">Status<select id="s-status">${["Neu", "In Bearbeitung", "Erledigt"].map((s) => `<option ${s === x.status ? "selected" : ""}>${s}</option>`).join("")}</select></label>
          <label class="feld">Nachricht an ${esc(p.vorname)} ${esc(p.nachname)}<textarea id="s-text" rows="2" placeholder="z. B. Handwerker kommt am Donnerstag"></textarea></label>
          <button class="knopf voll" type="submit">Speichern</button></form>`
        : `<p><span class="pille ${statusKlasse(x.status)}">${esc(x.status)}</span></p>`}
      </div>`);
    return;
  }

  if (a === "einladen") {
    const p = person(id); p.zugang = "eingeladen"; protokoll(`Einladung versendet an ${pName(p)}`); speichern(); zeigen();
    return toast(`Einladung an ${pName(p)} versendet (${p.email}).`);
  }

  if (a === "lesestand") {
    const d = D.dokumente.find((x) => x.id === id), emp = empfaenger(d);
    dialog(d.titel, `<p class="klein leise">${esc(d.kat)} · ${d.jahr}${d.pflicht ? " · Pflichtdokument" : ""}</p>
      ${emp.length ? `<ul class="liste">${emp.map((p) => `<li><span>${esc(pName(p))} <span class="klein leise">${esc(einheit(p.einheit).nr)}</span></span>
        ${istGelesen(d.id, p.id) ? `<span class="klein">gelesen ${datum(D.gelesen[d.id][p.id])}</span>` : `<span class="pille neu">ungelesen</span>`}</li>`).join("")}</ul>` : `<p class="leise">Keine Empfänger.</p>`}`);
    return;
  }

  if (a === "hochladen") {
    dialog("Dokument hochladen", `<form class="stapel eng" data-form="hochladen">
      <label class="feld">Titel<input id="h-titel" required placeholder="z. B. Protokoll Beiratssitzung"></label>
      <div class="filter">
        <label class="feld">Kategorie<select id="h-kat"><option>Protokoll</option><option>Abrechnung</option><option>Wirtschaftsplan</option><option>Vermögensbericht</option><option>Vertrag</option><option>Plan</option><option>Sonstiges</option></select></label>
        <label class="feld">Jahr<input id="h-jahr" inputmode="numeric" value="2026"></label>
      </div>
      <label class="feld">Sichtbar für<select id="h-fuer"><option value="">Alle Eigentümer der WEG Musterstraße 12</option>${D.personen.filter((p) => einheit(p.einheit).weg === "w1").map((p) => `<option value="${p.id}">Nur ${esc(pName(p))} (persönlich)</option>`).join("")}</select></label>
      <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="h-pflicht"> Pflichtdokument (Lesebestätigung nachverfolgen)</label>
      <label class="feld">Datei<input type="file" accept="application/pdf"><span class="hinweis">In der Demo wird die Datei nicht hochgeladen.</span></label>
      <button class="knopf voll" type="submit">Hochladen und Eigentümer benachrichtigen</button></form>`);
    return;
  }

  if (a === "auskunft") {
    const p = person(ERIKA), e = einheit("e3");
    dialog("Ihre gespeicherten Daten", `<div class="blatt">
      <h3>Auskunft nach Art. 15 DSGVO · Stand ${HEUTE.toLocaleDateString("de-DE")}</h3>
      <div class="tabelle"><table><tbody>
        <tr><td>Name</td><td>${esc(pName(p))}</td></tr><tr><td>E-Mail</td><td>${esc(p.email)}</td></tr><tr><td>Telefon</td><td>${esc(p.telefon)}</td></tr>
        <tr><td>Anschrift</td><td>${esc(p.strasse)}, ${esc(p.plz)} ${esc(p.ort)}</td></tr><tr><td>Post statt Portal</td><td>${p.post ? "ja" : "nein"}</td></tr>
        <tr><td>Eigentum</td><td>${esc(weg("w1").name)}, ${esc(e.nr)}, seit 01.01.2020</td></tr>
        <tr><td>Anliegen</td><td>${D.anliegen.filter((x) => x.person === ERIKA).length}</td></tr>
        <tr><td>Lesebestätigungen</td><td>${Object.values(D.gelesen).filter((g) => g[ERIKA]).length}</td></tr>
        <tr><td>Persönliche Dokumente</td><td>${D.dokumente.filter((d) => d.person === ERIKA).map((d) => esc(d.titel)).join(", ")}</td></tr>
      </tbody></table></div><p class="klein leise">Daten anderer Eigentümer sind in dieser Auskunft nie enthalten.</p></div>`);
    return;
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "dok-jahr") { S.filter.jahr = t.value; zeigen(); }
  if (t.dataset.aktion === "freigabe") {
    const m = D.mitarbeiter.find((x) => x.id === t.dataset.id); m.freigabe = t.value;
    protokoll(`Freigabe geändert: ${m.name} → ${t.value === "alle" ? "alle Gemeinschaften" : t.value ? weg(t.value).name : "keine"}`); speichern(); zeigen();
    toast(`${m.name}: Freigabe gespeichert.`);
  }
  if (t.id === "n-fotos") {
    const ort = $("#n-vorschau"); ort.innerHTML = ""; ort.dataset.fotos = "[]";
    const daten = [];
    [...t.files].slice(0, 4).forEach((f) => {
      const r = new FileReader();
      r.onload = () => { daten.push(r.result); ort.insertAdjacentHTML("beforeend", `<img src="${r.result}" alt="Vorschau">`); ort.dataset.fotos = JSON.stringify(daten); };
      r.readAsDataURL(f);
    });
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "dok-suche") { S.filter.suche = t.value; const pos = t.selectionStart; zeigen(); const n = $("#dok-suche"); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === "b-suche") { S.bSuche = t.value; const pos = t.selectionStart; zeigen(); const n = $("#b-suche"); n.focus(); n.setSelectionRange(pos, pos); }
});

document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") schliessen(); });

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target, art = f.dataset.form, wert = (id) => ($("#" + id)?.value ?? "").trim();

  if (art === "passwort") { S.schritt = "code"; return zeigen(); }
  if (art === "code") {
    if (!/^\d{6}$/.test(wert("f-code").replace(/\s/g, ""))) { $("#code-fehler").hidden = false; return; }
    S.schritt = "fertig"; S.reiter = S.rolle === "eigentuemer" ? "uebersicht" : "dashboard"; return zeigen();
  }
  if (art === "daten") {
    const p = person(ERIKA);
    if (wert("d-plz") && !/^\d{5}$/.test(wert("d-plz"))) return toast("Bitte eine fünfstellige Postleitzahl eingeben.");
    Object.assign(p, { telefon: wert("d-tel"), strasse: wert("d-str"), plz: wert("d-plz"), ort: wert("d-ort"), post: $("#d-post").checked });
    protokoll("Eigene Kontaktdaten geändert"); speichern(); return toast("Ihre Kontaktdaten sind gespeichert.");
  }
  if (art === "makler") {
    const typ = f.dataset.art, e = einheit("e3");
    D.anliegen.push({ id: neueId("a"), weg: "w1", einheit: "e3", person: ERIKA, art: "Makleranfrage: " + typ, betreff: `${typ === "Bewertung" ? "Wert ermitteln" : typ === "Vermietung" ? "Vermieten" : "Verkaufen"} – ${e.nr}`,
      text: `${wert("mk-zeit")}. ${wert("mk-text")}`.trim(), ort: "", status: "Neu", datum: heuteIso(), fotos: [], verlauf: [[heuteIso(), "Anfrage gesendet"]] });
    speichern(); schliessen(); zeigen(); return toast("Danke! Ihre Anfrage ist bei uns eingegangen. Wir melden uns innerhalb von zwei Werktagen.");
  }
  if (art === "melden") {
    let fotos = []; try { fotos = JSON.parse($("#n-vorschau").dataset.fotos || "[]"); } catch (e) {}
    D.anliegen.push({ id: neueId("a"), weg: "w1", einheit: "e3", person: ERIKA, art: wert("n-art"), betreff: wert("n-betreff"), text: wert("n-text"), ort: wert("n-ort"), status: "Neu", datum: heuteIso(), fotos, verlauf: [[heuteIso(), "Gemeldet"]] });
    try { speichern(); } catch (e) {}
    schliessen(); S.reiter = "anliegen"; zeigen(); return toast("Anliegen gemeldet. Den Stand sehen Sie hier jederzeit.");
  }
  if (art === "status") {
    const x = D.anliegen.find((y) => y.id === f.dataset.id), neu = wert("s-status"), txt = wert("s-text");
    if (neu !== x.status) x.verlauf.push([heuteIso(), `Verwaltung: Status „${neu}“`]);
    if (txt) x.verlauf.push([heuteIso(), "Verwaltung: " + txt]);
    x.status = neu; protokoll(`Anliegen „${x.betreff}“ bearbeitet`); speichern(); schliessen(); zeigen();
    return toast(`Gespeichert. ${pName(person(x.person))} sieht den neuen Stand.`);
  }
  if (art === "mitteilung") {
    const w = wert("m-weg");
    D.mitteilungen.push({ id: neueId("m"), weg: w, art: wert("m-art"), titel: wert("m-titel"), text: wert("m-text"), datum: heuteIso() });
    protokoll(`Mitteilung veröffentlicht: ${wert("m-titel")}`); speichern(); zeigen();
    const anzahl = D.personen.filter((p) => einheit(p.einheit).weg === w && p.email).length;
    return toast(`Veröffentlicht. ${anzahl} Eigentümer werden per E-Mail benachrichtigt.`);
  }
  if (art === "hochladen") {
    const fuer = wert("h-fuer");
    D.dokumente.push({ id: neueId("d"), weg: "w1", kat: wert("h-kat"), titel: wert("h-titel"), jahr: Number(wert("h-jahr")) || 2026, person: fuer || undefined, pflicht: $("#h-pflicht").checked, art: "text" });
    protokoll(`Dokument hochgeladen: ${wert("h-titel")}`); speichern(); schliessen(); zeigen();
    return toast("Hochgeladen. Die Eigentümer werden per E-Mail benachrichtigt.");
  }
});

zeigen();
</script>
